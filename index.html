<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globus terraqüi amb Three.js</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #19406f 0%, #06111f 65%);
        color: #f3f7fb;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        max-width: min(24rem, calc(100vw - 2rem));
        padding: 0.9rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 1rem;
        background: rgba(8, 20, 36, 0.72);
        backdrop-filter: blur(8px);
      }

      .hud h1 {
        margin: 0 0 0.35rem;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
      }

      .hud p {
        margin: 0;
        line-height: 1.45;
        font-size: 0.95rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <h1 id="map-title">Planeta Terra interactiu</h1>
        <p id="map-help">Arrossega per girar el planeta i fes zoom amb la roda o amb dos dits al mòbil.</p>
      </div>
      <p id="map-description" class="sr-only">
        Visualització interactiva del planeta Terra amb una textura realista creada amb Three.js. Es pot girar arrossegant i ampliar amb la roda o amb dos dits al mòbil.
      </p>
    </div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js";

      const app = document.querySelector("#app");
      const description = document.querySelector("#map-description");

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.domElement.setAttribute("role", "img");
      renderer.domElement.setAttribute("aria-labelledby", "map-title map-description");
      renderer.domElement.setAttribute("aria-describedby", "map-help");
      app.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 8.5);
      camera.lookAt(0, 0, 0);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.75;
      controls.zoomSpeed = 0.9;
      controls.enablePan = false;
      controls.minDistance = 4.5;
      controls.maxDistance = 16;
      controls.touches.ONE = THREE.TOUCH.ROTATE;
      controls.touches.TWO = THREE.TOUCH.DOLLY_ROTATE;
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
      controls.autoRotate = false;

      const ambientLight = new THREE.AmbientLight(0xeaf4ff, 0.7);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 2.4);
      directionalLight.position.set(8, 4, 10);
      scene.add(directionalLight);

      const starCount = 1800;
      const starPositions = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount; i += 1) {
        const radius = THREE.MathUtils.randFloat(25, 80);
        const theta = THREE.MathUtils.randFloat(0, Math.PI * 2);
        const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));
        const offset = i * 3;

        starPositions[offset] = radius * Math.sin(phi) * Math.cos(theta);
        starPositions[offset + 1] = radius * Math.cos(phi);
        starPositions[offset + 2] = radius * Math.sin(phi) * Math.sin(theta);
      }

      const stars = new THREE.Points(
        new THREE.BufferGeometry(),
        new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.18,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.85,
        }),
      );
      stars.geometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
      scene.add(stars);

      const earthGroup = new THREE.Group();
      scene.add(earthGroup);

      const earth = new THREE.Mesh(
        new THREE.SphereGeometry(2.4, 96, 96),
        new THREE.MeshStandardMaterial({
          color: 0x4b85b8,
          roughness: 0.95,
          metalness: 0,
        }),
      );
      earthGroup.add(earth);

      const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(2.52, 96, 96),
        new THREE.MeshBasicMaterial({
          color: 0x59b8ff,
          transparent: true,
          opacity: 0.14,
        }),
      );
      earthGroup.add(atmosphere);
